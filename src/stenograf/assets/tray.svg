<!--
  The menu-bar / system-tray mark: the app icon's two commas without the tile.

  A Dock icon is a tile with artwork inside it; a status-bar icon is the
  artwork alone, on nothing, ~18 px tall. Handing `icon.png` to
  QSystemTrayIcon would put a dark rounded square in the menu bar, so the marks
  are repeated here on a transparent, square canvas with the padding a status
  item wants.

  Geometry is copied verbatim from `native/appbundle/icon.svg` — same head
  radius, same tail path, same 244 between the heads — with the pair re-centred
  on its own bounding box. If either file's marks change, change both.

  The two brand inks are used as-is on Windows and Linux, where a status icon
  is normally in colour. macOS gets a template image instead (tinted flat and
  flagged as a mask), and both platforms get the whole mark re-tinted while a
  meeting is recording or finalizing — see `gui/tray.py`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <g transform="translate(119.05,326.3) rotate(180)" fill="#4cc9f0">
    <circle cx="0" cy="0" r="104"/>
    <path d="M 74.9 52.0 C 106.1 149.8, 81.1 235.0, -6.2 276.6 C 27.0 193.4, 31.2 120.6, -31.2 91.5 Z"/>
  </g>
  <g transform="translate(363.05,326.3) rotate(180)" fill="#8b7bf0">
    <circle cx="0" cy="0" r="104"/>
    <path d="M 74.9 52.0 C 106.1 149.8, 81.1 235.0, -6.2 276.6 C 27.0 193.4, 31.2 120.6, -31.2 91.5 Z"/>
  </g>
</svg>
