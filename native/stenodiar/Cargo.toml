[package]
name = "stenodiar"
version = "0.1.0"
edition = "2021"
description = "Diarization helper: speakrs (pyannote community-1-class pipeline, VBx auto speaker count) behind a JSON CLI"
license = "MIT"
publish = false

[features]
# Acceleration is chosen at build time per platform: build.sh passes coreml on
# macOS; off-mac the default is ORT CPU, with cuda as the opt-in GPU path.
default = []
coreml = ["speakrs/coreml"]
cuda = ["speakrs/cuda"]

[dependencies]
speakrs = "0.5"

# Never referenced from code: it is here so cargo's feature unification builds
# the OpenSSL that speakrs' model download links (hf-hub → ureq → native-tls)
# from source and statically. Otherwise the binary needs the *build* machine's
# libssl.so.3 — the one thing that would stop a wheel-carried helper from
# starting on another distro (and manylinux_2_28 only has OpenSSL 1.1, which no
# current distro ships). native-tls uses Security.framework on macOS and
# SChannel on Windows and never touches OpenSSL there, hence the target gate.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
lto = true

# Vendored speakrs 0.5.0 with two CPU-throughput patches (see vendor/VENDOR.md);
# drop this section once they land upstream.
[patch.crates-io]
speakrs = { path = "vendor/speakrs" }
