name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = arm64 (the shipping target); ubuntu keeps the suite
        # collecting and passing on Linux ahead of the Phase 5 backends;
        # windows covers the Phase 6 capture/provider work (model-gated +
        # real-audio tests self-skip everywhere).
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      # PySide6 links libEGL even under QT_QPA_PLATFORM=offscreen, and it is
      # the one Qt runtime library the Linux runner image does not ship — so
      # importing tests/test_gui.py fails at collection without it. Everything
      # else Qt needs is already there; macOS and Windows need nothing.
      - run: sudo apt-get install -y libegl1
        if: runner.os == 'Linux'
      - run: uv sync
      - run: uv run ruff check .
      # macOS only: the platform-marker deps (mlx-lm, parakeet-mlx) are only
      # installed there, and pyright needs them importable to resolve types.
      - run: uv run --with pyright pyright
        if: runner.os == 'macOS'
      - run: uv run pytest -q

  # Build and unit-test the capture helper on both platforms it serves. The
  # framing arithmetic tests run everywhere; the pulse/wasapi backends only
  # compile on their own OS, which is exactly what this matrix pins down.
  stenocap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/stenocap
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/stenocap
      - run: cargo test --locked

  # Type-check the stenodiar helper (vendored speakrs) in the default CPU
  # config plus each platform's acceleration feature — coreml is macOS-only,
  # cuda is the Linux/Windows GPU opt-in. cargo check only: building or
  # running the models in CI is not worth the minutes.
  stenodiar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            features: coreml
          - os: ubuntu-latest
            features: cuda
          - os: windows-latest
            features: cuda
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/stenodiar
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/stenodiar
      - run: cargo check --locked
      - run: cargo check --locked --features ${{ matrix.features }}

  # Functional live capture on the stable-distro reference: a real PulseAudio
  # server (not pipewire-pulse — this is the one place the genuine article is
  # exercised, development machines all run PipeWire), a null sink as the
  # default output, TTS speech played into it, `steno start` capturing the
  # monitor through the stenocap helper, and the transcript asserted on
  # sentinel words. CachyOS (rolling) is covered by development itself;
  # this brackets the old end of the version range users actually run.
  capture-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Start a sound server
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libpulse-dev
          pulseaudio --start --exit-idle-time=-1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/stenocap
      - name: Build the capture helper
        # The dev-fallback location (next to its sources) is where the
        # provider looks in a checkout.
        run: sh native/stenocap/build.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-weights-${{ runner.os }}
      - run: uv sync
      - name: Prefetch models
        run: uv run steno setup --models-only
      - name: Synthesize meeting speech
        run: |
          uv run --no-project --with piper-tts python -m piper.download_voices en_US-lessac-medium
          uv run --no-project --with piper-tts python -m piper -m en_US-lessac-medium \
            --data-dir . --output_file speech.wav -- \
            "Good morning everyone, and welcome to the quarterly planning meeting. Today we will discuss the provisioning pipeline, the October release schedule, and the migration of the transcription backend. Thank you all for joining, and let us get started with the first agenda item."
      - name: Live-capture a meeting from the null sink
        run: |
          pactl load-module module-null-sink sink_name=steno_ci
          pactl set-sink-mute steno_ci 0
          pactl set-default-sink steno_ci
          uv run steno doctor
          uv run steno start --local 0 --remote 1 --max-seconds 40 --out meeting \
            > live.log 2>&1 &
          # generous: the fp32 ONNX model can take minutes to load on 2 CI cores
          for i in $(seq 1 600); do
            grep -q "capturing:" live.log && break
            sleep 0.5
          done
          paplay --device=steno_ci speech.wav
          wait
          cat live.log
      - name: Assert transcript content
        run: |
          cat meeting/transcript.txt
          grep -qi "provisioning" meeting/transcript.txt
          grep -qi "october" meeting/transcript.txt
