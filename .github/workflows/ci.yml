name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The fresh-resolve run. Users install with `uv tool install stenograf`,
  # which ignores uv.lock and takes the newest release every range in
  # pyproject.toml allows, so between releases they run a combination the
  # locked jobs never test. Weekly, the same jobs re-resolve to those newest
  # versions first; a failure opens (or comments on) an issue. Run it by hand
  # after raising a cap.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRESH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = arm64 (the shipping target); ubuntu keeps the suite
        # collecting and passing on Linux ahead of the Phase 5 backends;
        # windows covers the Phase 6 capture/provider work (model-gated +
        # real-audio tests self-skip everywhere).
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      # PySide6 links libEGL even under QT_QPA_PLATFORM=offscreen, and it is
      # the one Qt runtime library the Linux runner image does not ship — so
      # importing tests/test_gui.py fails at collection without it. Everything
      # else Qt needs is already there; macOS and Windows need nothing.
      - run: sudo apt-get install -y libegl1
        if: runner.os == 'Linux'
      - name: Resolve the newest versions a user install would get
        if: env.FRESH == 'true'
        run: uv lock --upgrade
      - run: uv sync
      - run: uv run ruff check .
        if: env.FRESH != 'true'
      # macOS only: the platform-marker deps (mlx-lm, parakeet-mlx) are only
      # installed there, and pyright needs them importable to resolve types.
      - run: uv run --with pyright pyright
        if: runner.os == 'macOS'
      - run: uv run pytest -q

  # The "Who spoke?" play button on Windows, played and recorded back through
  # a virtual sound card (hosted runners have none); both current images, so
  # an image change that breaks the install shows up before it is the only one.
  playback-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install a virtual sound card
        shell: pwsh
        run: .github/scripts/windows-sound-card.ps1
      - name: Resolve the newest versions a user install would get
        if: env.FRESH == 'true'
        run: uv lock --upgrade
      - run: uv sync
      - name: A voice sample plays whole, and stops when told
        run: uv run python .github/scripts/hear_playback_windows.py

  # Build and unit-test the capture helper on both platforms it serves. The
  # framing arithmetic tests run everywhere; the pulse/wasapi backends only
  # compile on their own OS, which is exactly what this matrix pins down.
  stenocap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/stenocap
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/stenocap
      - run: cargo test --locked

  # Functional live capture on the stable-distro reference: a real PulseAudio
  # server (not pipewire-pulse — this is the one place the genuine article is
  # exercised, development machines all run PipeWire), a null sink as the
  # default output, TTS speech played into it, `steno start` capturing the
  # monitor through the stenocap helper, and the transcript asserted on
  # sentinel words. CachyOS (rolling) is covered by development itself;
  # this brackets the old end of the version range users actually run.
  capture-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Start a sound server
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libpulse-dev
          pulseaudio --start --exit-idle-time=-1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/stenocap
      - name: Build the capture helper
        # The dev-fallback location (next to its sources) is where the
        # provider looks in a checkout.
        run: sh native/stenocap/build.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-weights-${{ runner.os }}
      - name: Resolve the newest versions a user install would get
        if: env.FRESH == 'true'
        run: uv lock --upgrade
      - run: uv sync
      - name: Prefetch models
        run: uv run steno setup --models-only
      - name: Synthesize meeting speech
        run: |
          uv run --no-project --with piper-tts python -m piper.download_voices en_US-lessac-medium
          uv run --no-project --with piper-tts python -m piper -m en_US-lessac-medium \
            --data-dir . --output_file speech.wav -- \
            "Good morning everyone, and welcome to the quarterly planning meeting. Today we will discuss the provisioning pipeline, the October release schedule, and the migration of the transcription backend. Thank you all for joining, and let us get started with the first agenda item."
      - name: Live-capture a meeting from the null sink
        run: |
          pactl load-module module-null-sink sink_name=steno_ci
          pactl set-sink-mute steno_ci 0
          pactl set-default-sink steno_ci
          uv run steno doctor
          uv run steno start --local 0 --remote 1 --max-seconds 40 --out meeting \
            > live.log 2>&1 &
          # generous: the fp32 ONNX model can take minutes to load on 2 CI cores
          for i in $(seq 1 600); do
            grep -q "capturing:" live.log && break
            sleep 0.5
          done
          paplay --device=steno_ci speech.wav
          wait
          cat live.log
      - name: Assert transcript content
        run: |
          cat meeting/transcript.txt
          grep -qi "provisioning" meeting/transcript.txt
          grep -qi "october" meeting/transcript.txt
      - name: A voice sample reaches the sound server through the bundled ffmpeg
        # The "Who spoke?" play button on Linux: ffmpeg's compiled-in PulseAudio
        # output into the default (null) sink, heard back on its monitor. A
        # 4 s tone, a real sample's length, must arrive whole: ffmpeg drops its
        # buffer at exit, so a cut-off ending fails here as surely as silence.
        run: |
          parec --device=steno_ci.monitor --format=s16le --rate=16000 --channels=1 > played.raw &
          rec=$!
          sleep 1
          uv run python -c "
          import threading, numpy as np
          from stenograf.playback import Playback
          tone = (0.3 * 32767 * np.sin(2 * np.pi * 440 * np.arange(4 * 16000) / 16000)).astype(np.int16)
          done, errors = threading.Event(), []
          Playback(tone, lambda error: (errors.append(error), done.set())).start()
          assert done.wait(30) and errors == [None], errors
          "
          sleep 1
          kill $rec
          python3 -c "
          import array, sys
          samples = array.array('h', open('played.raw', 'rb').read())
          # a 0.3-amplitude sine sits above 1000 for ~93.5 % of its samples
          heard = sum(1 for x in samples if abs(x) > 1000) / (16000 * 0.935)
          print(f'tone heard on the monitor: {heard:.2f} of 4 s')
          sys.exit(0 if heard >= 3.6 else 1)
          "

  # Only the fresh-resolve run reports: a red push or PR is already in front of
  # whoever caused it, but nobody is watching when an upstream release breaks.
  report-fresh-failure:
    needs: [test, playback-windows, capture-linux]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The newest dependency versions break stenograf"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "The weekly fresh-resolve CI run failed: $RUN_URL

          A fresh \`uv tool install stenograf\` today gets the versions that failed here, so new installs and \`uv tool upgrade\` are likely broken; existing installs are not. The step \"Resolve the newest versions a user install would get\" lists every package that moved. Find the one responsible, then either fix stenograf for it or cap it in pyproject.toml with the reason, and cut a patch release."
          fi
