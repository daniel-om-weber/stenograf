name: release

# Tag v<version> → build the wheel matrix, smoke-test a clean install on every
# supported OS, publish to PyPI (Trusted Publishing/OIDC — no token secrets) and
# attach the artifacts to a GitHub release. workflow_dispatch runs everything
# except the publish step, as a dry run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    # arm64 wheel with the compiled+signed stenocap (hatch_build.py)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      # The runner image ships Rust (stenodiar); fail early and loudly if that
      # ever changes rather than in the wheel-verify step.
      - run: cargo --version
      - run: uv build --wheel
      - name: Verify the wheel bundles a signed helper for macOS 14.4+
        run: |
          ls dist/*macosx_14_0_arm64.whl
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          otool -l /tmp/whl/stenograf/bin/stenocap | grep -q 'minos 14.4'
          codesign -v /tmp/whl/stenograf/bin/stenocap
      - name: Verify the wheel bundles the stenodiar diarization helper
        # The build hook skips stenodiar when the runner lacks Rust rather
        # than failing every source install — but a *published* wheel without
        # it silently degrades estimated speaker counts, so refuse it here.
        run: |
          unzip -o dist/*.whl 'stenograf/bin/stenodiar' -d /tmp/whl
          test -x /tmp/whl/stenograf/bin/stenodiar
          /tmp/whl/stenograf/bin/stenodiar --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/

  build-pure:
    # pure py3-none-any wheel + the sdist — what every platform without a
    # specific wheel below installs: no helpers, and estimated speaker counts
    # fall back to sherpa there. Since the GUI default flip this no longer
    # buys musl or old-glibc Linux arm64 an install at all: PySide6-Essentials
    # is a base dependency and ships no wheels for them (glibc floor 2.34
    # x86_64 / 2.39 arm64, no musllinux).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv build
      - name: Verify the pure wheel carries no helpers
        # No STENOGRAF_BUNDLE_HELPERS here, so the hook must stay a no-op.
        run: |
          ls dist/*py3-none-any.whl dist/*.tar.gz
          if unzip -l dist/*.whl | grep -qE 'stenocap|stenodiar'; then
            echo "pure wheel must not contain native helpers" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pure
          path: dist/

  build-linux-x86_64:
    # manylinux wheel bundling both helpers, pinned to the oldest runner whose
    # glibc the build can actually use. That floor is not ours to choose: the
    # onnxruntime static library ort-sys downloads references __isoc23_strtol
    # and friends, glibc 2.38 symbols, so the link fails outright in an older
    # image (manylinux_2_28 was tried and cannot build this at all). Ubuntu
    # 24.04 is glibc 2.39, hence the tag; anything older resolves the
    # low-floor capture wheel (build-linux-capture) and keeps sherpa-only
    # diarization. Pin the version rather than ubuntu-latest — when that label
    # moves, the floor must move deliberately, with the tag in hatch_build.py,
    # not silently under users.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STENOGRAF_BUNDLE_HELPERS: "1"
    steps:
      - uses: actions/checkout@v7
      # All named rather than assumed from the runner image, because the
      # failure modes are silent until the link step.
      # libpulse-dev is stenocap's one system dependency.
      # libssl-dev is for the *build scripts*, not for us: ort-sys downloads
      # onnxruntime over TLS at build time, and cargo resolves build-deps with
      # their own feature set, so stenodiar's vendored-OpenSSL flag never
      # reaches that copy of openssl-sys. The system OpenSSL links into a
      # throwaway build script; the shipped helper carries the vendored one, as
      # the ldd check asserts. perl (not perl-base) is what *builds* that
      # vendored OpenSSL — its Configure wants FindBin, IPC::Cmd and Time::Piece.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libssl-dev perl
      # The runner image ships Rust; fail early and loudly if that ever
      # changes rather than inside the build hook.
      - run: cargo --version
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv build --wheel
      - name: Verify the wheel bundles a working stenocap
        # The load-bearing helper: without it the wheel installs and cannot
        # record a meeting, which is exactly the failure a platform tag is
        # supposed to rule out. Same symbol-floor check as stenodiar below;
        # libpulse is linked dynamically on purpose (it is on any desktop with
        # audio, and pipewire-pulse provides the same ABI).
        run: |
          ls dist/*manylinux_2_39_x86_64.whl
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          test -x /tmp/whl/stenograf/bin/stenocap
          ldd /tmp/whl/stenograf/bin/stenocap | grep -q libpulse.so.0
          max=$(objdump -T /tmp/whl/stenograf/bin/stenocap |
                grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39
          /tmp/whl/stenograf/bin/stenocap --help
      - name: Verify the wheel bundles a portable stenodiar
        run: |
          ls dist/*manylinux_2_39_x86_64.whl
          unzip -o dist/*.whl 'stenograf/bin/stenodiar' -d /tmp/whl
          test -x /tmp/whl/stenograf/bin/stenodiar
          ldd /tmp/whl/stenograf/bin/stenodiar
          # Three ways a helper built here dies on a user's machine.
          # 1. A glibc symbol newer than the tag promises.
          max=$(objdump -T /tmp/whl/stenograf/bin/stenodiar |
                grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39
          # 2. A libstdc++ newer than this runner's — measured rather than
          #    hardcoded, so the claim is "runs anywhere with a libstdc++ at
          #    least as new as the one we built against".
          needed=$(objdump -T /tmp/whl/stenograf/bin/stenodiar |
                   grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
          have=$(objdump -T /usr/lib/x86_64-linux-gnu/libstdc++.so.6 |
                 grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
          echo "libstdc++: needs $needed, runner provides $have"
          test "$(printf '%s\n%s\n' "$needed" "$have" | sort -V | tail -1)" = "$have"
          # 3. The build machine's OpenSSL — stenodiar vendors it statically
          #    precisely so a user's OpenSSL version is never in the picture.
          if ldd /tmp/whl/stenograf/bin/stenodiar | grep -qE 'libssl|libcrypto'; then
            echo "stenodiar must not depend on the build machine's OpenSSL" >&2
            exit 1
          fi
          /tmp/whl/stenograf/bin/stenodiar --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-x86_64
          path: dist/

  build-linux-capture:
    # The low-floor Linux wheel: stenocap only, built in the oldest manylinux
    # image still maintained (AlmaLinux 8, glibc 2.28). It exists because the
    # full wheel's 2.39 floor is *stenodiar's* (ort-sys needs glibc 2.38
    # symbols to link) while stenocap links only libpulse — without this wheel,
    # Ubuntu 22.04 / Debian 12 / RHEL 9 would fall to the pure wheel and
    # silently lose live capture. pip ranks newer manylinux tags first, so
    # glibc ≥ 2.39 machines still resolve the full wheel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      STENOGRAF_BUNDLE_HELPERS: "capture"
    steps:
      - uses: actions/checkout@v7
      - run: dnf install -y pulseaudio-libs-devel unzip binutils
      - name: Install a Rust toolchain
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Build the wheel
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          /opt/python/cp313-cp313/bin/python -m pip install build
          /opt/python/cp313-cp313/bin/python -m build --wheel
      - name: Verify the wheel bundles stenocap and nothing heavier
        # stenodiar in this wheel would drag the glibc floor back up to the
        # exact machines the wheel exists to serve.
        run: |
          ls dist/*manylinux_2_28_x86_64.whl
          if unzip -l dist/*.whl | grep -q stenodiar; then
            echo "the capture wheel must not carry stenodiar" >&2
            exit 1
          fi
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          test -x /tmp/whl/stenograf/bin/stenocap
          ldd /tmp/whl/stenograf/bin/stenocap | grep -q libpulse.so.0
          max=$(objdump -T /tmp/whl/stenograf/bin/stenocap |
                grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          /tmp/whl/stenograf/bin/stenocap --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-capture
          path: dist/

  build-windows:
    # win_amd64 wheel bundling both helpers: stenocap (WASAPI capture) and
    # stenodiar (ORT CPU). Both are cargo + MSVC.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STENOGRAF_BUNDLE_HELPERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      # The runner image ships Rust; fail early and loudly if that ever
      # changes rather than inside the build hook.
      - run: cargo --version
      - run: uv build --wheel
      - name: Verify the wheel bundles both helpers
        # stenocap is the load-bearing one: without it the wheel installs and
        # cannot record a meeting, which is exactly the failure a platform tag
        # is supposed to rule out.
        shell: bash
        run: |
          ls dist/*win_amd64.whl
          unzip -o dist/*.whl 'stenograf/bin/*' -d /tmp/whl
          /tmp/whl/stenograf/bin/stenocap.exe --help
          /tmp/whl/stenograf/bin/stenodiar.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/

  smoke-macos:
    # The acceptance the wheel exists for: a clean machine's `uv tool install`
    # yields a green doctor and a working pipeline (capture itself needs TCC
    # prompts no headless runner can answer; --replay drives the same pipeline
    # from a file).
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos
          path: dist
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: brew install ffmpeg
      - run: uv tool install -p 3.13 ./dist/stenograf-*.whl
      - run: steno setup --models-only
      - run: steno doctor
      - name: Pipeline smoke on a synthetic WAV
        run: |
          python3 - <<'EOF'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(
                  struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 16000)))
                  for i in range(16000 * 3)))
          EOF
          steno start --replay smoke.wav --local 1 --remote 0 --lang en --out smoke-out
          test -f smoke-out/transcript.json

  smoke-linux:
    # Installs the manylinux wheel the way a user does — `uv tool install`,
    # not a checkout — and makes the helper reach the network: the statically
    # vendored OpenSSL has to find this machine's CA bundle before the model
    # download can work at all, and nothing earlier in the pipeline proves it.
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux-x86_64
          path: dist
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install -p 3.13 ./dist/stenograf-*manylinux_2_39_x86_64.whl
      - run: steno --version
      - run: steno setup --models-only
      - name: The installed helpers are found and stenodiar's TLS reaches HuggingFace
        # --warmup downloads the diarization models and nothing else, so it is
        # the cheapest end-to-end proof that the vendored OpenSSL build talks
        # to the network on a foreign distro. doctor exits 1 on a runner (no
        # sound server), so what is asserted is the helper lines: the capture
        # check must fail with the *helper's own* complaint about the sound
        # server, not because the wheel shipped without a capture helper.
        run: |
          steno doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          grep -q "stenograf/bin/stenodiar" doctor.txt
          if grep -qi "not found" doctor.txt; then
            echo "the installed wheel is missing a helper" >&2
            exit 1
          fi
          unzip -o dist/*.whl 'stenograf/bin/stenodiar' -d /tmp/whl
          /tmp/whl/stenograf/bin/stenodiar --warmup

  smoke-linux-capture:
    # The population the low-floor wheel exists for: a glibc-2.35 distro
    # (Ubuntu 22.04) where the full wheel's manylinux_2_39 tag does not even
    # apply. Installs the wheel the way a user's resolver would land on it and
    # proves the bundled helper actually starts against that glibc and its
    # libpulse — the two things the tag promises.
    needs: build-linux-capture
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux-capture
          path: dist
      - run: |
          apt-get update
          apt-get install -y curl ca-certificates unzip libpulse0
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install -p 3.13 ./dist/stenograf-*manylinux_2_28_x86_64.whl
      - run: steno --version
      - name: The bundled helper runs and doctor reaches it
        # No sound server in the container, so the capture check must fail
        # with the helper's own connection complaint — proof the binary ran —
        # and never with a missing-helper message.
        run: |
          steno doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          grep -q "sound server" doctor.txt
          if grep -qi "not found" doctor.txt; then
            echo "the installed wheel has no working capture helper" >&2
            exit 1
          fi
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          /tmp/whl/stenograf/bin/stenocap --help

  smoke-windows:
    # Nothing verified a clean Windows install before publish until 0.2.1
    # shipped a launcher that died on every meeting start. The GUI controllers
    # are covered by the offscreen Qt tests in ci.yml's windows unit job; this
    # leg is the *installed artifact* check: the wheel installs, carries its
    # helper, renders through a redirected stdout, and runs the pipeline end
    # to end from a file.
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # wheel globs + $HOME; the runner ships Git bash
    steps:
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist
      # uv installs tool executables to ~/.local/bin on Windows too.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install -p 3.13 ./dist/stenograf-*win_amd64.whl
      - run: steno --version
      # ffmpeg is the bundled imageio-ffmpeg binary here — nothing to install.
      - run: steno setup --models-only
      - name: The report renders through a redirected stdout
        # doctor *exits 1* on a runner by design: it has no audio endpoint, so
        # the (non-optional) capture check fails. What this asserts is that the
        # report renders at all — piped Windows stdout uses the legacy code page,
        # and click.echo once crashed outright on the ✓/✗ glyphs (fixed by
        # reconfiguring the streams with errors="replace"; this pins it down).
        run: |
          steno doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          grep -q "ASR backend" doctor.txt
          grep -q "ffmpeg" doctor.txt
          # The installed wheel's own helpers, not a stray build in the checkout.
          grep -qi "stenodiar.exe" doctor.txt
          # The capture check cannot *pass* on a runner — there is no audio
          # endpoint — but it must fail for that reason and not because the
          # wheel shipped without a capture helper, which is the regression a
          # platform-tagged wheel exists to prevent. When the binary is there,
          # the complaint comes from the helper itself instead.
          if grep -qi "not found" doctor.txt; then
            echo "the installed wheel has no capture helper" >&2
            exit 1
          fi
      - name: Pipeline smoke on a synthetic WAV
        # Live WASAPI capture needs hardware no runner has; --replay drives the
        # same pipeline from a file.
        run: |
          uv run --no-project --python 3.13 python - <<'EOF'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(
                  struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 16000)))
                  for i in range(16000 * 3)))
          EOF
          steno start --replay smoke.wav --local 1 --remote 0 --lang en --out smoke-out
          test -f smoke-out/transcript.json

  publish:
    # build-pure is listed explicitly: no smoke leg installs the pure wheel any
    # more (each platform now smokes its own), but PyPI still needs it and the
    # sdist, and download-artifact below collects whatever has finished.
    needs: [build-pure, smoke-macos, smoke-linux, smoke-linux-capture, smoke-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify the tag matches the project version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} != project version v${version}" >&2
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
