name: release

# Tag v<version> → build the wheel matrix, smoke-test a clean install on every
# supported OS, publish to PyPI (Trusted Publishing/OIDC — no token secrets) and
# attach the artifacts to a GitHub release. workflow_dispatch runs everything
# except the publish step, as a dry run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    # arm64 wheel with the compiled+signed stenocap (hatch_build.py)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv build --wheel
      - name: Verify the wheel bundles a signed helper for macOS 14.4+
        run: |
          ls dist/*macosx_14_0_arm64.whl
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          otool -l /tmp/whl/stenograf/bin/stenocap | grep -q 'minos 14.4'
          codesign -v /tmp/whl/stenograf/bin/stenocap
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/

  build-pure:
    # pure py3-none-any wheel + the sdist — what every platform without a
    # specific wheel below installs: no capture helper, so no live capture.
    # Since the GUI default flip this no longer
    # buys musl or old-glibc Linux arm64 an install at all: PySide6-Essentials
    # is a base dependency and ships no wheels for them (glibc floor 2.34
    # x86_64 / 2.39 arm64, no musllinux).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv build
      - name: Verify the pure wheel carries no helpers
        # No STENOGRAF_BUNDLE_HELPERS here, so the hook must stay a no-op.
        run: |
          ls dist/*py3-none-any.whl dist/*.tar.gz
          if unzip -l dist/*.whl | grep -q stenocap; then
            echo "pure wheel must not contain native helpers" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pure
          path: dist/

  build-linux-x86_64:
    # The Linux wheel, built in the oldest manylinux image still maintained
    # (AlmaLinux 8, glibc 2.28): stenocap links only libpulse, so that floor is
    # its own, and Ubuntu 22.04 / Debian 12 / RHEL 9 get live capture rather
    # than falling to the pure wheel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      STENOGRAF_BUNDLE_HELPERS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: dnf install -y pulseaudio-libs-devel unzip binutils
      - name: Install a Rust toolchain
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Build the wheel
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          /opt/python/cp313-cp313/bin/python -m pip install build
          /opt/python/cp313-cp313/bin/python -m build --wheel
      - name: Verify the wheel bundles a working stenocap
        # Without it the wheel installs and cannot record a meeting, which is
        # exactly the failure a platform tag is supposed to rule out. libpulse
        # is linked dynamically on purpose (it is on any desktop with audio,
        # and pipewire-pulse provides the same ABI).
        run: |
          ls dist/*manylinux_2_28_x86_64.whl
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          test -x /tmp/whl/stenograf/bin/stenocap
          ldd /tmp/whl/stenograf/bin/stenocap | grep -q libpulse.so.0
          max=$(objdump -T /tmp/whl/stenograf/bin/stenocap |
                grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          /tmp/whl/stenograf/bin/stenocap --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-x86_64
          path: dist/

  build-windows:
    # win_amd64 wheel bundling stenocap (WASAPI capture), built with cargo +
    # MSVC.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STENOGRAF_BUNDLE_HELPERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      # The runner image ships Rust; fail early and loudly if that ever
      # changes rather than inside the build hook.
      - run: cargo --version
      - run: uv build --wheel
      - name: Verify the wheel bundles the capture helper
        # Without it the wheel installs and cannot record a meeting, which is
        # exactly the failure a platform tag is supposed to rule out.
        shell: bash
        run: |
          ls dist/*win_amd64.whl
          unzip -o dist/*.whl 'stenograf/bin/*' -d /tmp/whl
          /tmp/whl/stenograf/bin/stenocap.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/

  smoke-macos:
    # The acceptance the wheel exists for: a clean machine's `uv tool install`
    # yields a green doctor and a working pipeline (capture itself needs TCC
    # prompts no headless runner can answer; --replay drives the same pipeline
    # from a file).
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos
          path: dist
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: brew install ffmpeg
      - run: uv tool install -p 3.13 ./dist/stenograf-*.whl
      - run: steno setup --models-only
      - run: steno doctor
      - name: Pipeline smoke on a synthetic WAV
        run: |
          python3 - <<'EOF'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(
                  struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 16000)))
                  for i in range(16000 * 3)))
          EOF
          steno start --replay smoke.wav --local 1 --remote 0 --lang en --out smoke-out
          test -f smoke-out/transcript.json

  smoke-linux:
    # Installs the manylinux wheel the way a user does — `uv tool install`,
    # not a checkout — on a current distro, downloads every model, and opens
    # the desktop app's interface from the installed wheel.
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux-x86_64
          path: dist
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # For doctor's desktop-app check below — the runner image's gap, the same
      # one ci.yml installs against, not the wheel's.
      - run: sudo apt-get install -y libegl1
      - run: uv tool install -p 3.13 ./dist/stenograf-*manylinux_2_28_x86_64.whl
      - run: steno --version
      - run: steno setup --models-only
      - name: The installed helper is found and the interface loads
        # doctor exits 1 on a runner (no sound server), so what is asserted is
        # the helper line: the capture check must fail with the *helper's own*
        # complaint about the sound server, not because the wheel shipped
        # without a capture helper.
        run: |
          steno doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          # The QML tree loads from the installed wheel — the desktop app is
          # the default UI, and no other leg of this pipeline opens it.
          grep -q "Qt loads and the interface compiles" doctor.txt
          if grep -qi "not found" doctor.txt; then
            echo "the installed wheel is missing a helper" >&2
            exit 1
          fi

  smoke-linux-old-glibc:
    # The oldest population the wheel's tag serves: a glibc-2.35 distro
    # (Ubuntu 22.04). Installs the wheel the way a user's resolver would land
    # on it and proves the bundled helper actually starts against that glibc
    # and its libpulse — the two things the tag promises.
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux-x86_64
          path: dist
      - run: |
          apt-get update
          apt-get install -y curl ca-certificates unzip libpulse0
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install -p 3.13 ./dist/stenograf-*manylinux_2_28_x86_64.whl
      - run: steno --version
      - name: The bundled helper runs and doctor reaches it
        # No sound server in the container, so the capture check must fail
        # with the helper's own connection complaint — proof the binary ran —
        # and never with a missing-helper message ("capture helper 'stenocap'
        # not found", "the capture helper could not be run"); the working
        # path's complaint comes from the helper itself and never names it.
        run: |
          steno doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          grep -q "sound server" doctor.txt
          if grep -qi "capture helper" doctor.txt; then
            echo "the installed wheel has no working capture helper" >&2
            exit 1
          fi
          unzip -o dist/*.whl 'stenograf/bin/stenocap' -d /tmp/whl
          /tmp/whl/stenograf/bin/stenocap --help

  smoke-windows:
    # Nothing verified a clean Windows install before publish until 0.2.1
    # shipped a launcher that died on every meeting start. The GUI controllers
    # are covered by the offscreen Qt tests in ci.yml's windows unit job; this
    # leg is the *installed artifact* check: the wheel installs, carries its
    # helper, renders through a redirected stdout, and runs the pipeline end
    # to end from a file.
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # wheel globs + $HOME; the runner ships Git bash
    steps:
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist
      # uv installs tool executables to ~/.local/bin on Windows too.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install -p 3.13 ./dist/stenograf-*win_amd64.whl
      - run: steno --version
      # ffmpeg is the bundled imageio-ffmpeg binary here — nothing to install.
      - run: steno setup --models-only
      - name: The report renders through a redirected stdout
        # doctor *exits 1* on a runner by design: it has no audio endpoint, so
        # the (non-optional) capture check fails. What this asserts is that the
        # report renders at all — piped Windows stdout uses the legacy code page,
        # and click.echo once crashed outright on the ✓/✗ glyphs (fixed by
        # reconfiguring the streams with errors="replace"; this pins it down).
        run: |
          steno doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          grep -q "ASR backend" doctor.txt
          grep -q "ffmpeg" doctor.txt
          # The QML tree loads from the installed wheel, in a `uv tool`
          # environment — the combination a user has and no other job builds.
          # A Windows install whose Qt cannot load its style plugin is exactly
          # the failure this line exists to catch (2026-08-11).
          grep -q "Qt loads and the interface compiles" doctor.txt
          # The capture check cannot *pass* on a runner — there is no audio
          # endpoint — but it must fail for that reason and not because the
          # wheel shipped without a capture helper, which is the regression a
          # platform-tagged wheel exists to prevent. The complaint quoted here
          # is wasapi.rs's own, so seeing it proves the binary shipped and ran;
          # a missing or unrunnable helper is Python-side and always names the
          # "capture helper". Matching "not found" at large cannot tell them
          # apart — WASAPI reports an absent endpoint as "Element not found".
          grep -q "check Windows sound settings" doctor.txt
          if grep -qi "capture helper" doctor.txt; then
            echo "the installed wheel has no working capture helper" >&2
            exit 1
          fi
      - name: Pipeline smoke on a synthetic WAV
        # Live WASAPI capture needs hardware no runner has; --replay drives the
        # same pipeline from a file.
        run: |
          uv run --no-project --python 3.13 python - <<'EOF'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(
                  struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 16000)))
                  for i in range(16000 * 3)))
          EOF
          steno start --replay smoke.wav --local 1 --remote 0 --lang en --out smoke-out
          test -f smoke-out/transcript.json

  # The self-update, on the wheel about to be published: an installed copy of
  # it finds a newer release, prepares it, swaps itself and starts again — and
  # goes back when the newer release does not start (scripts/update_e2e.py says
  # what stands in for PyPI and for the user). A release that cannot be updated
  # *to* strands nobody; one that cannot update *from* strands every install it
  # reaches, and the only repair is asking each user to run the installer. So
  # these gate the publish.
  update-macos:
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos
          path: dist
      - run: uv run --no-project --python 3.13 python scripts/update_e2e.py --wheel dist/stenograf-*.whl

  update-linux:
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux-x86_64
          path: dist
      # Qt's offscreen platform, as in smoke-linux.
      - run: sudo apt-get install -y libegl1
      - run: uv run --no-project --python 3.13 python scripts/update_e2e.py --wheel dist/stenograf-*manylinux_2_28_x86_64.whl

  update-windows:
    # Informative, not a gate, and deliberately absent from publish's needs:
    # the swap has not been measured on Windows, so the app there only tells
    # the user about a new release (update.SWAP_MEASURED). This job runs the
    # swap anyway; when it is green and a real desktop session agrees, Windows
    # joins SWAP_MEASURED and this job joins the gate.
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist
      - run: uv run --no-project --python 3.13 python scripts/update_e2e.py --wheel dist/stenograf-*win_amd64.whl

  publish:
    # build-pure is listed explicitly: no smoke leg installs the pure wheel any
    # more (each platform now smokes its own), but PyPI still needs it and the
    # sdist, and download-artifact below collects whatever has finished.
    needs:
      - build-pure
      - smoke-macos
      - smoke-linux
      - smoke-linux-old-glibc
      - smoke-windows
      - update-macos
      - update-linux
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify the tag matches the project version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} != project version v${version}" >&2
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
